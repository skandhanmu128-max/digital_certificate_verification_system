version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certiverify-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/certiverify
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres_secure_pass
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_BASE_URL=http://localhost:8080
      - APP_ADMIN_USERNAME=admin
      - APP_ADMIN_PASSWORD=admin123password
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: certiverify-postgres
    environment:
      - POSTGRES_DB=certiverify
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certiverify"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: digital-certificate-verification-system
  
  datasource:
    url: jdbc:h2:mem:certdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

app:
  base-url: http://localhost:8080
  admin:
    username: admin
    password: admin123password

logging:
  level:
    root: INFO
    com.example.certificates: DEBUG
    org.springframework.security: INFO

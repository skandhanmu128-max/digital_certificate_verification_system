<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue New Certificate | CertiVerify Admin</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/admin/dashboard">
                <i class="bi bi-shield-check fs-3 text-primary"></i>
                <span class="fs-4">CertiVerify Admin</span>
            </a>
            <a href="/admin/dashboard" class="btn btn-outline-custom btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h2 class="text-white fw-bold mb-1">Issue New Digital Certificate</h2>
                        <p class="text-muted small mb-0">Generates a unique UUID v4 verification code &amp; QR embedded PDF record.</p>
                    </div>
                </div>

                <div class="glass-card p-4 p-md-5">
                    <form th:action="@{/admin/certificates/new}" th:object="${certificateForm}" method="post">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="recipientName" class="form-label text-white small fw-semibold">
                                    Recipient Full Name <span class="text-danger">*</span>
                                </label>
                                <input type="text" 
                                       id="recipientName" 
                                       th:field="*{recipientName}" 
                                       class="form-control bg-dark text-white border-secondary" 
                                       placeholder="e.g. Eleanor Vance" 
                                       required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}">Error</div>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="recipientEmail" class="form-label text-white small fw-semibold">
                                    Recipient Email (Optional)
                                </label>
                                <input type="email" 
                                       id="recipientEmail" 
                                       th:field="*{recipientEmail}" 
                                       class="form-control bg-dark text-white border-secondary" 
                                       placeholder="e.g. eleanor@example.com">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('recipientEmail')}" th:errors="*{recipientEmail}">Error</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="courseName" class="form-label text-white small fw-semibold">
                                Course / Qualification Title <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   id="courseName" 
                                   th:field="*{courseName}" 
                                   class="form-control bg-dark text-white border-secondary" 
                                   placeholder="e.g. Certified Data Science & Machine Learning Specialist" 
                                   required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}">Error</div>
                        </div>

                        <div class="mb-3">
                            <label for="issuedBy" class="form-label text-white small fw-semibold">
                                Issuing Institution / Authority <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   id="issuedBy" 
                                   th:field="*{issuedBy}" 
                                   class="form-control bg-dark text-white border-secondary" 
                                   placeholder="e.g. Global Tech Certification Authority" 
                                   required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('issuedBy')}" th:errors="*{issuedBy}">Error</div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="issueDate" class="form-label text-white small fw-semibold">
                                    Issue Date <span class="text-danger">*</span>
                                </label>
                                <input type="date" 
                                       id="issueDate" 
                                       th:field="*{issueDate}" 
                                       class="form-control bg-dark text-white border-secondary" 
                                       required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}">Error</div>
                            </div>

                            <div class="col-md-6">
                                <label for="expiryDate" class="form-label text-white small fw-semibold">
                                    Expiry Date (Leave empty for Lifetime)
                                </label>
                                <input type="date" 
                                       id="expiryDate" 
                                       th:field="*{expiryDate}" 
                                       class="form-control bg-dark text-white border-secondary">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}">Error</div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center justify-content-end gap-3 border-top border-secondary border-opacity-50 pt-4">
                            <a href="/admin/dashboard" class="btn btn-outline-custom">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4">
                                <i class="bi bi-patch-check-fill me-1"></i> Generate &amp; Issue Certificate
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-0 small">Digital Certificate Verification System &copy; 2026 Admin Portal.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

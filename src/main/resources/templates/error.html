<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | CertiVerify</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-patch-check-fill fs-3 text-primary"></i>
                <span class="fs-4">CertiVerify</span>
            </a>
            <a href="/" class="btn btn-outline-custom btn-sm">
                <i class="bi bi-house me-1"></i> Home
            </a>
        </div>
    </nav>

    <main class="container my-auto py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="glass-card p-5">
                    <div class="display-1 fw-bold text-primary mb-2">404</div>
                    <h2 class="text-white fw-bold mb-3">Page or Resource Not Found</h2>
                    <p class="text-muted mb-4">
                        The requested page, certificate endpoint, or admin URL does not exist or has been moved.
                    </p>

                    <div class="d-flex justify-content-center gap-3">
                        <a href="/" class="btn btn-primary-custom px-4">
                            <i class="bi bi-house-fill me-1"></i> Back to Verification Portal
                        </a>
                        <a href="/admin/dashboard" class="btn btn-outline-custom px-4">
                            <i class="bi bi-speedometer2 me-1"></i> Admin Dashboard
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-0 small">Digital Certificate Verification System &copy; 2026.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

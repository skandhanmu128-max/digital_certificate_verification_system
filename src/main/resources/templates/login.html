<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CertiVerify</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-patch-check-fill fs-3 text-primary"></i>
                <span class="fs-4">CertiVerify</span>
            </a>
            <a href="/" class="btn btn-outline-custom btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back to Public Portal
            </a>
        </div>
    </nav>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                        <i class="bi bi-shield-lock-fill fs-1"></i>
                    </div>
                    <h2 class="text-white fw-bold">Admin Portal</h2>
                    <p class="text-muted small">Authenticate to access certificate issuing &amp; analytics dashboard.</p>
                </div>

                <!-- Error & Info Alerts -->
                <div th:if="${errorMessage}" class="alert alert-danger border-0 bg-danger bg-opacity-20 text-danger text-center small mb-3">
                    <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${errorMessage}">Error</span>
                </div>

                <div th:if="${infoMessage}" class="alert alert-info border-0 bg-info bg-opacity-20 text-info text-center small mb-3">
                    <i class="bi bi-info-circle me-1"></i> <span th:text="${infoMessage}">Info</span>
                </div>

                <!-- Login Glass Card -->
                <div class="glass-card p-4">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label text-white small fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="username" name="username" class="form-control bg-dark text-white border-secondary" placeholder="admin" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-white small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                        </button>
                    </form>

                    <!-- Pre-filled Credentials Tip -->
                    <div class="p-3 rounded bg-dark border border-secondary border-opacity-50 text-muted small">
                        <i class="bi bi-lightbulb-fill text-warning me-1"></i> <strong>Default Credentials:</strong><br>
                        Username: <code>admin</code><br>
                        Password: <code>admin123password</code>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container">
            <p class="mb-0 small">Digital Certificate Verification System &copy; 2026. Secure Admin Panel.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
